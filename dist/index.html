/* ---------- paint ---------- */
function paint(){
  var el=$('#list'); if(!el) return;
  el.innerHTML=!ready?'<p class="empty">Loading…</p>':PAGES[page]();
  if(refocus){var f=$(refocus); if(f) f.focus(); refocus=null}
  sizeGrid(); wireGrid(); paintPins();
  if(page==='cal'&&ready){
    var ck=calView+'|'+calDate;
    if(centredKey!==ck){centredKey=ck; centreGrid()}
  }
  var dm=$('.devbar .dmsg');
  if(dm&&!devArm) dm.textContent=notesCount()+' note'+(notesCount()===1?'':'s');
}
var TITLES={today:'Today',cal:'Calendar',habits:'Habits',tasks:'Tasks',more:'More',goals:'Goals',rewards:'Rewards',track:'Tracking',settings:'Settings'};
TITLES.notes='Dev notes';
var NAVOF={more:'more',goals:'more',rewards:'more',settings:'more',notes:'more',today:'more'};
function showPage(){
  var d=new Date();
  $('#dateline').textContent=(readOnly?'Not saving · ':'')+DOWFULL[d.getDay()]+' '+d.getDate()+' '+MONFULL[d.getMonth()];
  $('#title').textContent=TITLES[page]||'Shamanigans';
  document.documentElement.setAttribute('data-pg',page);
  var navp=NAVOF[page]||page;
  document.querySelectorAll('#bottom button').forEach(function(b){
    if(b.dataset.page===navp) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current')});
  document.querySelectorAll('#side button').forEach(function(b){
    if(b.dataset.page===page) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current')});
  $('#settings').setAttribute('aria-pressed',page==='settings');
  var comp=false;   /* adding happens inside each category */
  var ph='Add a task, e.g. mix demo friday #music';
  $('#view').innerHTML=devBarHTML()+(comp?'<form class="composer" id="composer"><input id="q" placeholder="'+esc(ph)+'" aria-label="New task" autocomplete="off" enterkeyhint="done"><button>Add</button></form><p id="hint" aria-live="polite"></p>':'')+'<div id="list"></div>';
  store('lp.page',page); openId=null; confirmDel=null; picked=null; centredKey=null; paint();

/* put the current hour (or the start of the day's window) near the top.
   runs once the data has landed, not before, or there is no grid to scroll */
var centredKey=null;
function centreGrid(){
  var g=$('.gscroll'); if(!g||calView==='month'||calView==='year') return;
  var r0=+g.dataset.r0||0, r1=+g.dataset.r1||1440, inner=g.scrollHeight;
  var n=new Date(), m=(gridDate()===today)?(n.getHours()*60+n.getMinutes()):8*60;
  var first=null;
  ((set.windows||{})[dowOf(gridDate())]||[]).forEach(function(w){
    var t=toMin(w[0]); if(first==null||t<first) first=t;
  });
  if(gridDate()!==today&&first!=null) m=first;
  var y=Math.round((Math.max(r0,m-45)-r0)/(r1-r0)*inner);
  g.scrollTop=Math.max(0,Math.min(y,inner-g.clientHeight));
}

/* ---------- smart input ---------- */
function resolveCat(name){
  if(!name) return '';
  var m=cats().filter(function(c){return c.name.toLowerCase().indexOf(name)===0||c.id===name})[0];
  return m?m.id:'';
}
function preview(){
  var q=$('#q'), hi=$('#hint'); if(!q||!hi) return;
  if(!q.value.trim()){hi.textContent=''; return}
  var p=parseQuick(q.value), bits=[];
  if(p.due) bits.push(dueLabel(p.due)+' '+fromIso(p.due).getDate()+' '+MONN[fromIso(p.due).getMonth()]);
  var c=resolveCat(p.cat); if(c) bits.push(catOf(c).name);
  if(p.prio===3) bits.push('High priority'); if(p.prio===1) bits.push('Low priority');
  hi.textContent=bits.length?'→ '+bits.join(' · '):'';
}
function addFromInput(){
  var q=$('#q'); if(!q||!q.value.trim()) return;
  var p=parseQuick(q.value);
  putTask({id:uid(),title:p.title,cat:resolveCat(p.cat),due:p.due,plan:p.due===today?today:null,block:null,at:null,mins:null,prio:p.prio,done:false,doneAt:null,subs:[],repeat:null,parent:null,created:Date.now(),example:false});
  q.value=''; preview(); q.focus();
}

/* ---------- placing into blocks ---------- */
function place(kind,id,blkId){
  var d=gridDate(), b=blocks[blkId];
  if(!b) return;
  var s=toMin(b.start), len=Math.min(30,Math.max(15,toMin(b.end)-s));
  editThing(kind,id,function(o){o.block=blkId; o.at=s; o.mins=o.mins||len; if(kind==='task') o.plan=d});
  picked=null;
}

    else if(c.contains('h-per')) editHabit(id,function(h){h.sched.per=Math.max(1,Math.min(7,+e.target.value||1))});
    else if(c.contains('h-goal')) editHabit(id,function(h){h.goal=Math.max(1,Math.min(7,+e.target.value||1))});
    else if(c.contains('h-lim')) editHabit(id,function(h){h.startLimit=Math.max(0,+e.target.value||0)});
    else if(c.contains('h-every')) editHabit(id,function(h){h.every=Math.max(1,+e.target.value||1)});
    else if(c.contains('h-emoji')) editHabit(id,function(h){h.emoji=e.target.value.trim().slice(0,4)});
    else if(c.contains('h-target')) editHabit(id,function(h){var v=+e.target.value||0; h.target=v>0?v:null});
    else if(c.contains('h-unit')) editHabit(id,function(h){h.unit=e.target.value.trim().slice(0,12)});
    else if(c.contains('g-title')){var gv=e.target.value.trim(); if(gv) editGoal(id,function(g){g.title=gv}); else paint()}
    else if(c.contains('g-cat')) editGoal(id,function(g){g.cat=e.target.value});
    else if(c.contains('g-due')) editGoal(id,function(g){g.due=e.target.value||null});
    return;
  }
  if(e.target.id==='dfile'){
    var file=e.target.files&&e.target.files[0]; if(!file) return;
    var fr=new FileReader(), msg=$('#dmsg');
    fr.onload=function(){
      try{ restore(JSON.parse(fr.result)); var m2=$('#dmsg'); if(m2) m2.textContent='Restored \u00b7 '+countAll()+' items'; }
      catch(x){ var m3=$('#dmsg'); if(m3) m3.textContent='That file could not be read'; }
    };
    fr.onerror=function(){ if(msg) msg.textContent='That file could not be read' };
    fr.readAsText(file); return;
  }
  var cr=e.target.closest('[data-cid]');
  if(cr&&e.target.classList.contains('c-name')){
    var nm=e.target.value.trim(), cid3=cr.dataset.cid;
    if(nm){ set.cats=cats().map(function(c){return c.id===cid3?{id:c.id,name:nm,hue:c.hue,parent:c.parent||null}:c}); putSet() }
    else paint();
    return;
  }
  if(cr&&e.target.classList.contains('c-parent')){
    var pid=e.target.value, cid2=cr.dataset.cid;
    set.cats=cats().map(function(c){return c.id===cid2?{id:c.id,name:c.name,hue:c.hue,parent:(pid&&pid!==c.id)?pid:null}:c});
    putSet(); return;
  }
  var wr=e.target.closest('.winrow');
  if(wr){
    var d=+wr.dataset.dow, ix=+wr.dataset.i, s=$('.w-s',wr).value, en=$('.w-e',wr).value;
    set.windows=set.windows||{};
    var ws=(set.windows[d]||[]).slice();
    ws[ix]=(s&&en&&en>s)?[s,en]:null;
    set.windows[d]=ws.filter(Boolean).sort(function(a,b){return toMin(a[0])-toMin(b[0])});
    putSet();
  }
});

/* modal events */
$('#pins').addEventListener('click',function(e){
  var p=e.target.closest('.pin'); if(p) openModal('note',{id:p.dataset.nid});
});
$('#modal').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return;
  var act=b.dataset.act;
  if(act==='mclose'||(act==='mscrim'&&e.target===b)) return closeModal();
  if(act==='hvalsave'){
    var v2=Math.max(0,+($('#hvalin')||{}).value||0), hid=modal.data.id, hd=modal.data.date;
    editHabit(hid,function(x){x.log=x.log||{}; if(v2>0) x.log[hd]=v2; else delete x.log[hd]});
    closeModal(); return;
  }
  if(act==='itmsave'||act==='itmoff'||act==='itmdone'){
    var k=modal.data.k, id2=modal.data.id;
    if(act==='itmoff') editThing(k,id2,function(o){o.at=null; o.mins=null});
    else if(act==='itmdone') editTask(id2,function(o){o.done=!o.done; o.doneAt=o.done?Date.now():null});
    else {
      var st=($('#is')||{}).value, mn=Math.max(15,+($('#im')||{}).value||30);
      editThing(k,id2,function(o){if(st) o.at=toMin(st); o.mins=Math.round(mn/15)*15});
    }
    closeModal(); return;
  }
  if(act==='nsave'){
    var txt=(($('#notetext')||{}).value||'').trim(), d=modal.data;
    if(d.id){ if(notes[d.id]){var ex=clone(notes[d.id]); ex.text=txt; putNote(ex)} }
    else putNote({id:uid(),page:d.page,x:d.x,y:d.y,target:d.target||'',tag:d.tag||'',text:txt,done:false,at:Date.now()});
    closeModal(); return;
  }
  if(act==='ndelm'){ drop('notes',notes,modal.data.id); closeModal(); return }
  if(act==='slipsave'){
    var note=($('#slipnote')||{}).value||'', id=modal.data.id, date=modal.data.date;
    var h=habits[id];
    if(h){ editHabit(id,function(x){x.slips=x.slips||{}; x.slips[date]=note.trim()}); }
    closeModal(); return;
  }
  if(act==='bday'){
    var d=+b.dataset.d, a=modal.data.days||[];
    modal.data.days=a.indexOf(d)>=0?a.filter(function(x){return x!==d}):a.concat([d]).sort();
    b.setAttribute('aria-pressed',modal.data.days.indexOf(d)>=0); return;
  }
  if(act==='qtsave'){
    var qttl=$('#qt').value.trim(); if(!qttl){ $('#qt').focus(); return }
    var qcat=$('#qc').value, qd=modal.data.day||gridDate(), qa=modal.data.at||0;
    putTask({id:uid(),title:qttl,cat:qcat,due:null,plan:qd,block:blockAt(qd,qa),
      at:qa,mins:modal.data.mins||60,prio:1,done:false,doneAt:null,subs:[],repeat:null,
      parent:null,ord:nextOrd(null,qcat),created:Date.now(),example:false});
    closeModal(); return;
  }
  if(act==='qtblk'){
    var ba=modal.data.at||0, bd=modal.data.day;
    openModal('block',{start:hhmm(ba),end:hhmm(Math.min(1440,ba+(modal.data.mins||60))),day:bd}); return;
  }
  if(act==='blksave'){
    var t=$('#bt').value.trim(), cat=$('#bc').value, s=$('#bs').value, en=$('#be').value, days=modal.data.days||[];
    if(!s||!en||en<=s){ $('#be').focus(); return }
    if(!t) t=catOf(cat).name;
    var ex=modal.data.id&&blocks[modal.data.id];
    var b2={id:ex?ex.id:uid(),title:t,cat:cat,start:s,end:en,days:days.length?days:[dowOf(modal.data.day||gridDate())],date:null,
            lock:!!modal.data.lock,example:false};
    putBlock(b2); closeModal(); return;
  }
  if(act==='blkdel'){
    var bid=modal.data.id;
    arr(tasks).filter(function(x){return x.block===bid}).forEach(function(x){editTask(x.id,function(t){t.block=null})});
    arr(habits).filter(function(x){return x.block===bid}).forEach(function(x){editHabit(x.id,function(h){h.block=null})});
    drop('blocks',blocks,bid); closeModal(); return;
  }
});

/* one list of pages drives the sidebar on a laptop and the bar on a phone */
var NAV=[['cal','Calendar'],['tasks','Tasks'],['habits','Habits'],['track','Tracking'],['more','More']];
var SIDE=[['cal','Calendar'],['tasks','Tasks'],['habits','Habits'],['track','Tracking'],
          ['gap'],['goals','Goals'],['rewards','Rewards'],['today','Today'],['settings','Settings']];
var svg=function(k,s){return '<svg width="'+(s||21)+'" height="'+(s||21)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+(ICON[k]||'')+'</svg>'};
function buildNav(){
  $('#bottom').firstElementChild.innerHTML=NAV.map(function(n){
    return '<button data-page="'+n[0]+'">'+svg(n[0])+n[1]+'</button>'}).join('');
  $('#side').innerHTML='<div class="brand">'+svg('habits',19)+'Shamanigans</div>'+
    SIDE.map(function(n){
      return n[0]==='gap'?'<div class="gap"></div>':'<button data-page="'+n[0]+'">'+svg(n[0])+n[1]+'</button>'}).join('');
  document.querySelectorAll('#bottom button,#side button').forEach(function(b){
    b.addEventListener('click',function(){page=b.dataset.page; showPage()})});
}
buildNav();
$('#settings').addEventListener('click',function(){page=page==='settings'?'cal':'settings'; showPage()});

/* theme: auto -> light -> dark */
var ICONS={
  auto:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',
  light:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',
  dark:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'
};
var theme=store('lp.theme')||'auto';
function applyTheme(){
  var r=document.documentElement;
  r.setAttribute('data-look',set.look||'sage');
  if(theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',theme);
  var b=$('#theme');
  b.innerHTML='<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[theme]+'</svg>';
  b.setAttribute('aria-label','Theme: '+theme); b.title='Theme: '+theme;
}
$('#theme').addEventListener('click',function(){theme={auto:'light',light:'dark',dark:'auto'}[theme]; store('lp.theme',theme); applyTheme()});
applyTheme();

function tick(){var n=iso(new Date()); if(n!==today){if(calDate===today) calDate=n; today=n; rollOverdue(); showPage()}}
setInterval(tick,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden) tick()});
/* iOS pinch-zooms the page through gesture events; the grid's own zoom is pointer-based */
['gesturestart','gesturechange','gestureend'].forEach(function(t){
  document.addEventListener(t,function(e){ if(e.cancelable) e.preventDefault() },{passive:false});
});
/* and a second finger anywhere outside the grid must not scale the page either */
document.addEventListener('touchmove',function(e){
  if(!(e.touches&&e.touches.length>1)||!e.cancelable) return;
  var tg=e.target&&e.target.closest?e.target.closest('.gscroll'):null;
  if(!tg) e.preventDefault();   /* the grid keeps its own pinch-to-zoom */
},{passive:false});
var rsz, wasPhone=isPhone();
window.addEventListener('resize',function(){clearTimeout(rsz); rsz=setTimeout(function(){
  /* the calendar is laid out differently either side of the break, so rebuild there */
  if(isPhone()!==wasPhone){wasPhone=isPhone(); paint(); return}
  sizeGrid();
},120)});

showPage();
(async function(){
  var ns=null;
  try{ ns=(window.claude&&window.claude.use)?await window.claude.use('db'):null }catch(e){ ns=null }
  if(!ns){loadLocal(); applyTheme(); ready=true; rollOverdue(); paint(); return}   /* the saved look lives in the data */
  db=ns;
  var got=0, need=function(){if(++got>=1){ready=true; rollOverdue()} paint()};
  db.doc('settings/main').onSnapshot(function(s){
    var d=s.exists?s.data():null;
    set={cats:(d&&d.cats)||DEFAULT_CATS.slice(),windows:(d&&d.windows)||clone(DEFAULT_WIN),
      trips:(d&&d.trips)||[],cap:(d&&d.cap)||3,look:(d&&d.look)||'sage'};
    applyTheme(); paint();
  },fail);
  db.collection('tasks').onSnapshot(function(s){
    var next={}; s.docs.forEach(function(d){var v=clone(d.data()); v.id=d.id; v.subs=v.subs||[]; next[d.id]=v});
    tasks=next; need();
  },fail);
  db.collection('habits').onSnapshot(function(s){
    var next={}; s.docs.forEach(function(d){var v=clone(d.data()); v.id=d.id; v.log=v.log||{}; v.slips=v.slips||{}; v.sched=v.sched||{type:'daily',days:[]}; next[d.id]=v});
    habits=next; paint();
  },fail);
  db.collection('blocks').onSnapshot(function(s){
    var next={}; s.docs.forEach(function(d){var v=clone(d.data()); v.id=d.id; next[d.id]=v});
    blocks=next; paint();
  },fail);
  ['goals','rewards','redeems','notes'].forEach(function(name){
    db.collection(name).onSnapshot(function(s){
      var next={}; s.docs.forEach(function(d){var v=clone(d.data()); v.id=d.id; next[d.id]=v});
      if(name==='goals') goals=next; else if(name==='rewards') rewards=next;
      else if(name==='redeems') redeems=next; else notes=next;
      paint();
    },fail);
  });
})();
})();
